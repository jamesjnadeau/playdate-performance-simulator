name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: native/WASM parity
        run: scripts/wasm-parity.sh
      - name: build the web bundle for the smoke test
        run: cargo build --release -p pdsim-wasm --target wasm32-unknown-emscripten --bin pdsim-web
      - name: browser build smoke test (under Node)
        run: node scripts/wasm-web-smoke.mjs
      - name: app tests and web build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build:web
      - name: wasm size
        run: |
          ls -l app/dist/pdsim_web.wasm
          echo "gzipped: $(gzip -9 -c app/dist/pdsim_web.wasm | wc -c) bytes"
