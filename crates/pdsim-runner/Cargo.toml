[package]
name = "pdsim-runner"
description = "Loads a Playdate game (Lua or C) into the performance simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pdsim-core = { path = "../pdsim-core" }
pdsim-device = { path = "../pdsim-device" }
pdsim-lua = { path = "../pdsim-lua" }
pdsim-arm = { path = "../pdsim-arm", optional = true }

[features]
default = ["c-games"]
# Loading C games (pdex.elf) needs the ARM emulator; browser builds drop it.
c-games = ["dep:pdsim-arm"]
