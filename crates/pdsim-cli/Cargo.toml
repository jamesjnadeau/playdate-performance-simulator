[package]
name = "pdsim-cli"
description = "Headless runner for the Playdate performance simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pdsim"
path = "src/main.rs"

[dependencies]
pdsim-core = { path = "../pdsim-core" }
pdsim-device = { path = "../pdsim-device" }
pdsim-lua = { path = "../pdsim-lua" }
pdsim-runner = { path = "../pdsim-runner", default-features = false }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
pdsim-session = { path = "../pdsim-session", default-features = false }
tungstenite = "0.27"

[features]
default = ["c-games"]
c-games = ["pdsim-runner/c-games", "pdsim-session/c-games"]
thumb = ["pdsim-runner/thumb", "pdsim-session/thumb"]
# `--cpu unicorn` advice: the Unicorn backend comes with C games.
unicorn = ["c-games"]
