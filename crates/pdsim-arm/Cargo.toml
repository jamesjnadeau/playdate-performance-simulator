[package]
name = "pdsim-arm"
description = "Runs Playdate C games (pdex.elf) in a Cortex-M7 emulator with block-level cycle costing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pdsim-core = { path = "../pdsim-core" }
pdsim-gfx = { path = "../pdsim-gfx" }
pdsim-device = { path = "../pdsim-device" }
pdsim-cpu = { path = "../pdsim-cpu" }
unicorn-engine = { version = "2.1", optional = true }
pdsim-thumb = { path = "../pdsim-thumb", optional = true }
capstone = "0.14"
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }

[features]
default = ["unicorn"]
# The Unicorn CPU backend (a C library; GPL-2.0).
unicorn = ["dep:unicorn-engine"]
# The pure-Rust Thumb interpreter backend (builds for WASM).
thumb = ["dep:pdsim-thumb"]

[[test]]
name = "c_game"
required-features = ["unicorn"]

[[test]]
name = "thumb_vs_unicorn"
required-features = ["unicorn", "thumb"]
