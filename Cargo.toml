[workspace]
resolver = "2"
members = [
    "crates/pdsim-core",
    "crates/pdsim-gfx",
    "crates/pdsim-device",
    "crates/pdsim-lua",
    "crates/pdsim-arm",
    "crates/pdsim-runner",
    "crates/pdsim-session",
    "crates/pdsim-cli",
    "app/src-tauri",

]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamesjnadeau/playdate-performance-simulator"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
